# Weekly: bump the Ghost pin, regenerate the manifest, run the suites, update the one drift PR (src/drift/cli.ts).
# Needs the admin setting "Allow GitHub Actions to create and approve pull requests". Optional secret
# CONFORMANCE_PR_TOKEN (GitHub App or fine-grained token): PRs opened with GITHUB_TOKEN start no workflows.
name: 🔁 Conformance drift (newest Ghost)
on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:
    inputs:
      ghost-version:
        description: "Ghost version to test, e.g. 6.73.0 (default: newest release with an official image)"
        type: string
        required: false
        default: ""
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

env:
  DRIFT_BASE: ${{ github.event.repository.default_branch }}

jobs:
  # Runs the dev dependencies and a fresh Ghost, so it gets a read-only token and keeps none on disk.
  drift:
    name: 👻 Drift against newest Ghost
    runs-on: ubuntu-26.04
    timeout-minutes: 45
    outputs:
      planned: ${{ steps.plan.outcome == 'success' }}
    defaults:
      run:
        working-directory: packages/ghost-conformance
    steps:
      # The pin and the PR base are the default branch's; a run from another branch would rewrite its PR.
      - name: 🛑 Only from the default branch
        if: github.ref_name != github.event.repository.default_branch
        working-directory: .
        run: |
          echo "::error::Run the drift workflow from $DRIFT_BASE, not $GITHUB_REF_NAME."
          exit 1

      - name: ⬇️ Checkout repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: ⎔ Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22.x
          check-latest: true
          cache: "pnpm"

      - name: 📥 Download deps
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: 🔎 Resolve newest Ghost and bump the pin
        id: plan
        run: pnpm drift plan
        env:
          GHOST_TARGET: ${{ inputs.ghost-version }}
          GITHUB_TOKEN: ${{ github.token }}

      # Steps from here may fail so the PR still shows the result; the verdict step fails the job.
      - name: 🗺️ Regenerate manifest
        id: manifest
        if: steps.plan.outputs.bump == 'true'
        continue-on-error: true
        run: pnpm manifest

      - name: 🧭 Client → manifest check against the new manifest
        if: steps.plan.outputs.bump == 'true'
        continue-on-error: true
        run: pnpm drift client

      - name: 🧪 Live suite against the new Ghost
        if: steps.plan.outputs.bump == 'true'
        continue-on-error: true
        run: pnpm drift suite

      - name: 📝 Render PR body
        if: steps.plan.outputs.bump == 'true'
        run: pnpm drift body
        env:
          MANIFEST_OUTCOME: ${{ steps.manifest.outcome }}

      - name: 📦 Keep the drift state for the PR job
        if: ${{ !cancelled() && steps.plan.outcome == 'success' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: drift
          path: |
            packages/ghost-conformance/.drift/
            packages/ghost-conformance/ghost-version
            packages/ghost-conformance/manifest.json
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14

      - name: 🚦 Fail when the manifest, client check or live suite failed
        if: steps.plan.outputs.bump == 'true'
        run: pnpm drift verdict
        env:
          MANIFEST_OUTCOME: ${{ steps.manifest.outcome }}

  # The only job with write access: runs our own drift script with plain Node, no dependencies installed.
  pr:
    name: 📬 Update the drift PR
    needs: drift
    if: ${{ !cancelled() && needs.drift.outputs.planned == 'true' }}
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
    defaults:
      run:
        working-directory: packages/ghost-conformance
    steps:
      - name: ⬇️ Checkout repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: ⎔ Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22.x
          check-latest: true

      - name: 📦 Restore the drift state
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: drift
          path: packages/ghost-conformance

      - name: 📬 Open, update or close the drift PR
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          node src/drift/cli.ts pr
        env:
          GH_TOKEN: ${{ secrets.CONFORMANCE_PR_TOKEN || github.token }}
          # git push reads the token from the environment at use time; nothing is written to .git/config.
          GIT_CONFIG_COUNT: "1"
          GIT_CONFIG_KEY_0: credential.https://github.com.helper
          GIT_CONFIG_VALUE_0: '!f() { echo username=x-access-token; echo "password=$GH_TOKEN"; }; f'
