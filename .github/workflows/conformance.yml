name: 🔁 Conformance (live Ghost)
on:
  pull_request:
    branches:
      - main
  workflow_dispatch: {}
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  live:
    name: 👻 Live suite against pinned Ghost
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: packages/ghost-conformance
    steps:
      - name: ⬇️ Checkout repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: ⎔ Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22.x
          check-latest: true
          cache: "pnpm"

      - name: 📥 Download deps
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: 🧪 Live conformance suite
        run: pnpm test:live

      # The Tests workflow gates on the client check; this run only records its calls for the summary.
      - name: 📊 Client coverage of the pinned manifest
        if: ${{ !cancelled() }}
        run: |
          status=0
          pnpm exec vitest run src/client-routes/client-manifest.test.ts \
            --reporter=default --reporter=json --outputFile.json="$RUNNER_TEMP/client.json" || status=$?
          pnpm coverage "$RUNNER_TEMP/client.json"
          exit "$status"
